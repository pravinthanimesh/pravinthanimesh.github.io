<html>
    <head><title>test</title>
    <style>
        .box{
            width:100px;
            height: 100px;
            background-color: brown;
            color: white;
            font-size:32px;
            display:flex;
            justify-content: center;
            align-items: center;
            
        }
        .container{
            display:grid;
            gap:1rem;
           grid-template-columns: repeat(3,33%);
           
        }


    </style>
    </head>
    <body>
        <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        </div>
    </body>


</html>
